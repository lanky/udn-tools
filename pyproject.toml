[project]
name = "udn-tools"
readme = "README.md"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.14"
dependencies = [
    "bs4>=0.0.2",
    "jmespath>=1.1.0",
    "loguru>=0.7.3",
    "lxml>=6.0.2",
    "pychord>=1.3.2",
    "requests>=2.33.0",
    "selenium>=4.41.0",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
repository = "https://github.com/lanky/udn-tools"
"Bug Tracker" = "https://github.com/lanky/udn-tools/issues"

[project.scripts]
ug_to_udn = "udn_tools.ug_to_udn:main"
crd_to_udn = "udn_tools.parse_chordsheet:main"

[dependency-groups]
dev = ["ipython>=9.11.0", "ruff>=0.15.7", "ty>=0.0.25"]

[build-system]
requires = ["uv_build>=0.11.1,<0.12"]
build-backend = "uv_build"
